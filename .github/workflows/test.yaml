name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install mise
        uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2

      - name: Install carthage from local plugin
        run: |
          mise settings set experimental true
          mise use "vfox:file://${{ github.workspace }}@0.40.0"
        env:
          MISE_DEBUG: 1

      - name: Verify carthage works
        run: |
          mise x "vfox:file://${{ github.workspace }}@0.40.0" -- which carthage
